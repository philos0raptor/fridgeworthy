name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # Three files a fresh checkout does not have, because the real ones are gitignored:
      # Config/Secrets.swift and both xcconfigs, which the project references as base
      # configurations. Missing either kind fails the build with an error that does not
      # mention configuration at all — "cannot find 'Secrets' in scope", or "Unable to
      # open base configuration reference file".
      #
      # scripts/bootstrap-secrets.sh cannot help here: it copies from another checkout,
      # and CI has none. The committed templates carry placeholders, which is all a
      # compile needs — no real credentials are involved.
      - name: Materialise gitignored config from templates
        # find rather than a ** glob: the runner's /bin/bash is 3.2, which has no
        # globstar, and the failure ("invalid shell option name") reads like a typo.
        run: |
          set -euo pipefail
          find . -name '*.template' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' template; do
              target="${template%.template}"
              cp "$template" "$target"
              echo "created $target"
            done

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project fridgeworthy/fridgeworthy.xcodeproj \
            -scheme fridgeworthy \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            build 2>&1 | tee build.log | grep -E '(error|warning):|BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' build.log

      - name: Report warnings
        if: always()
        run: |
          # Counts are only comparable clean-to-clean, so report unique sources rather
          # than raw lines — see CLAUDE.md.
          echo "### Build warnings" >> "$GITHUB_STEP_SUMMARY"
          grep 'warning:' build.log \
            | sed -E 's#^.*/fridgeworthy/##' \
            | sort -u \
            | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || echo "none" >> "$GITHUB_STEP_SUMMARY"

  backend-contract:
    name: Backend contract tests
    runs-on: ubuntu-latest
    # Runs only where the repository secrets are available. Forked pull requests do not
    # get them, and a skipped job is more honest than one that silently passes nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check whether backend credentials are configured
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_URL is not set — skipping. See tests/README.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Free checks only. The paid checks call Anthropic and fal and cost real money per
      # run, so they stay opt-in via workflow_dispatch rather than firing on every push.
      - name: Run contract tests
        if: steps.creds.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: python3 tests/backend_contract_test.py
